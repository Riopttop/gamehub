<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="styles/variables.css">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<!-- BGM: assets/audio/bgm.mp3 파일 추가하면 자동 재생됨 -->
<audio id="bgm" src="assets/audio/bgm.mp3" loop preload="auto"></audio>

<!-- ========================= HEADER ========================= -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">🎮</div>
      <span>GameHub</span>
    </div>

    <div class="search">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>
      </svg>
      <input type="text" class="search-input" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="게임 검색...">
    </div>

    <div class="user-area">
      <button class="icon-btn" id="settingsBtn" data-i18n-aria-label="settings" aria-label="설정">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <div class="user-chip">
        <div class="avatar" id="userAvatar">G</div>
        <span id="userName" data-i18n="guest">게스트</span>
      </div>
      <button class="login-btn" id="loginBtn" data-i18n="login">로그인</button>
      <button class="logout-btn" id="logoutBtn" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span data-i18n="logout">로그아웃</span>
      </button>
    </div>
  </div>
</header>

<!-- ========================= MAIN ========================= -->
<main class="main">
  <div class="filters">
    <div class="filter-group" data-filter="players">
      <button class="chip active" data-value="all" data-i18n="filterAll">전체</button>
      <button class="chip" data-value="1">1P</button>
      <button class="chip" data-value="2">2P</button>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-group" data-filter="genre">
      <button class="chip active" data-value="all" data-i18n="filterAllGenres">모든 장르</button>
      <button class="chip" data-value="arcade" data-i18n="genreArcade">아케이드</button>
      <button class="chip" data-value="puzzle" data-i18n="genrePuzzle">퍼즐</button>
      <button class="chip" data-value="horror" data-i18n="genreHorror">공포</button>
      <button class="chip" data-value="competitive" data-i18n="genreCompetitive">경쟁</button>
    </div>
  </div>

  <div class="game-grid" id="gameGrid"></div>
</main>

<!-- ========================= SETTINGS MODAL ========================= -->
<div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="settingsTitle" data-i18n="settings">설정</h2>
      <button class="modal-close" id="settingsCloseBtn" data-i18n-aria-label="close" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">

      <section class="setting-section">
        <label class="setting-label" data-i18n="music">음악</label>
        <div class="setting-row">
          <span style="color: var(--text-muted); font-size: 13.5px;" data-i18n="backgroundMusic">배경음악</span>
          <button class="music-toggle" id="musicToggle">
            <svg id="musicIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span id="musicLabel" data-i18n="play">재생</span>
          </button>
        </div>
        <div class="volume-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
          <span class="volume-value" id="volumeValue">50%</span>
        </div>
      </section>

      <section class="setting-section">
        <label class="setting-label" data-i18n="theme">테마</label>
        <div class="segment" data-setting="theme">
          <button class="segment-btn" data-value="light" data-i18n="themeLight">라이트</button>
          <button class="segment-btn" data-value="dark" data-i18n="themeDark">다크</button>
        </div>
      </section>

      <section class="setting-section">
        <label class="setting-label" data-i18n="language">언어</label>
        <div class="segment" data-setting="lang">
          <button class="segment-btn" data-value="ko">한국어</button>
          <button class="segment-btn" data-value="en">English</button>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- ========================= LOGIN MODAL ========================= -->
<div class="modal-backdrop" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="modal modal-auth">
    <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">
      <span></span>
      <button class="modal-close" id="loginCloseBtn" data-i18n-aria-label="close" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">

      <div class="auth-header">
        <div class="auth-emoji">🎮</div>
        <h2 class="auth-title" id="authTitle">다시 만나서 반가워</h2>
        <p class="auth-subtitle" id="authSubtitle">GameHub에 로그인</p>
      </div>

      <form class="auth-form" id="authForm" novalidate>

        <div class="form-field" id="nameField" hidden>
          <label class="form-label" for="authName" data-i18n="name">이름</label>
          <input type="text" class="form-input" id="authName" autocomplete="name" data-i18n-placeholder="namePlaceholder" placeholder="이름 입력">
          <div class="field-error" id="nameError"></div>
        </div>

        <div class="form-field">
          <label class="form-label" for="authEmail" data-i18n="email">이메일</label>
          <input type="email" class="form-input" id="authEmail" autocomplete="email" placeholder="you@example.com">
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="form-field">
          <div class="form-field-header">
            <label class="form-label" for="authPassword" data-i18n="password">비밀번호</label>
            <a href="#" class="form-link" id="forgotLink" data-i18n="forgotPassword">비밀번호를 잊으셨나요?</a>
          </div>
          <div class="password-wrapper">
            <input type="password" class="form-input" id="authPassword" autocomplete="current-password" data-i18n-placeholder="passwordPlaceholder" placeholder="비밀번호 입력">
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="비밀번호 보기">
              <svg id="passwordToggleIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <button type="submit" class="form-submit" id="authSubmit" data-i18n="login">로그인</button>
      </form>

      <div class="form-divider"><span data-i18n="or">또는</span></div>

      <button class="form-toggle" id="authModeToggle">
        <span id="authToggleText">계정이 없으신가요?</span>
        <strong id="authToggleAction">회원가입</strong>
      </button>

      <p class="demo-note" data-i18n="demoNote">🛠 데모 모드 — 백엔드 연동 전까지 아무 정보로 로그인됩니다</p>

    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
